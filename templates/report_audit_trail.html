{% extends "base.html" %}

{% block title %}Audit Trail{% endblock %}

{% block content %}
<h1>Audit Trail</h1>
<form class="dashboard-section" id="auditFilters" onsubmit="exportReport(); return false;">
    <h3 style="font-size:0.95rem; margin:0 0 12px">When the change was made</h3>
    <div class="entry">
        <label for="from_date">Changed From:</label>
        <input type="text" id="from_date" name="from_date" class="input-standard-width"
               placeholder="DD-MM-YYYY" pattern="\d{2}-\d{2}-\d{4}">
    </div>
    <div class="entry">
        <label for="to_date">Changed To:</label>
        <input type="text" id="to_date" name="to_date" class="input-standard-width"
               placeholder="DD-MM-YYYY" pattern="\d{2}-\d{2}-\d{4}">
    </div>

    <h3 style="font-size:0.95rem; margin:18px 0 12px">The voucher itself</h3>
    <div class="entry">
        <label for="voucher_from">Voucher Dated From:</label>
        <input type="text" id="voucher_from" name="voucher_from" class="input-standard-width"
               placeholder="DD-MM-YYYY" pattern="\d{2}-\d{2}-\d{4}">
    </div>
    <div class="entry">
        <label for="voucher_to">Voucher Dated To:</label>
        <input type="text" id="voucher_to" name="voucher_to" class="input-standard-width"
               placeholder="DD-MM-YYYY" pattern="\d{2}-\d{2}-\d{4}">
    </div>
    <div class="entry">
        <label for="voucher_type">Voucher Type:</label>
        <select id="voucher_type" name="voucher_type" class="input-standard-width">
            <option value="">All</option>
            {% for t in voucher_types %}
            <option value="{{ t }}">{{ t }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="entry">
        <label for="voucher_number">Voucher Number:</label>
        <input type="text" id="voucher_number" name="voucher_number" class="input-standard-width"
               placeholder="any part of the number">
    </div>
    <div class="entry">
        <label for="action">Action:</label>
        <select id="action" name="action" class="input-standard-width">
            <option value="">All</option>
            {% for a in actions %}
            <option value="{{ a }}">{{ a }}</option>
            {% endfor %}
        </select>
    </div>

    <div style="margin-top:18px">
        <button type="submit" class="btn btn-info">Export to Excel</button>
        <button type="button" class="btn btn-secondary" onclick="clearFilters()">Clear</button>
    </div>
</form>

<script>
    function exportReport() {
        const form = document.getElementById('auditFilters');
        const params = new URLSearchParams();
        // Only send what was filled in, so the filename and the query stay tidy.
        new FormData(form).forEach((value, key) => {
            if (String(value).trim()) params.append(key, value);
        });
        window.location.href = '/export_report/audit_trail?' + params.toString();
    }

    function clearFilters() {
        document.getElementById('auditFilters').reset();
    }
</script>
{% endblock %}
