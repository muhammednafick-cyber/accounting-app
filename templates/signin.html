{% extends "base.html" %}
{% block title %}Sign In · Prodata{% endblock %}
{% block content %}
<section class="auth-card" aria-labelledby="signin-title">
    <h1 id="signin-title">Welcome back</h1>
    <p>Sign in to your accounting workspace.</p>
    {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div><label for="login_id">Username or email</label>
            <input type="text" id="login_id" name="login_id" autocomplete="username" required autofocus></div>
        <div><label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required></div>
        <button type="submit">Sign in</button>
    </form>
</section>
{% endblock %}
