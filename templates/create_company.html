{% extends "base.html" %}

{% block title %}Create a company{% endblock %}

{% block extra_head %}
<style>
    /* Reached from the company gateway, before any company is open - so, like
       the gateway, no sidebar: its links would bounce straight back. */
    .app-sidebar { display: none !important; }
    body.app-shell { padding-left: 0; }
    .app-topbar { left: 0; }
    #sidebarToggle { display: none; }

    .cc { max-width: 760px; margin: 0 auto; }
    .cc-head { margin-bottom: 22px; }
    .cc-head h1 { margin: 0 0 6px; }
    .cc-head p { color: var(--ink-muted); margin: 0; }

    .cc-section {
        background: var(--surface); border: 1px solid var(--border);
        border-radius: var(--radius-lg); padding: 22px 24px; margin-bottom: 16px;
    }
    /* Scoped under .cc so it outranks the app-wide ".main-content h2" size,
       which is meant for page headings, not section labels. */
    .cc .cc-section h2 {
        font-size: 15px; font-weight: 650; color: var(--ink-strong);
        margin: 0 0 16px; letter-spacing: 0;
    }
    .cc-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
    .cc-field { margin-bottom: 16px; }
    .cc-field label {
        display: block; font-size: 13px; font-weight: 600;
        color: var(--ink); margin-bottom: 6px;
    }
    .cc-field input, .cc-field select {
        width: 100%; min-height: 42px; padding: 9px 12px;
        border: 1px solid var(--border); border-radius: 8px;
        font-size: 14px; background: #fff;
    }
    .cc-required { color: #b3261e; }

    .cc-check {
        display: flex; align-items: center; gap: 10px;
        padding: 8px 0; font-size: 14px; color: var(--ink);
    }
    .cc-check input { width: 18px; height: 18px; accent-color: var(--brand); }
    .cc-check label { cursor: pointer; }

    #locationSection { display: none; margin-top: 14px; }
    .cc-location {
        border: 1px solid var(--border); border-radius: 10px;
        padding: 14px 16px; margin-bottom: 12px; background: var(--page);
    }
    .cc-location-head {
        display: flex; justify-content: space-between; align-items: center;
        margin-bottom: 12px; font-size: 13px; font-weight: 650;
    }

    .cc-btn {
        display: inline-flex; align-items: center; justify-content: center;
        min-height: 42px; padding: 10px 20px; border-radius: 8px;
        font-weight: 600; font-size: 14px; cursor: pointer;
        text-decoration: none; border: 1px solid transparent;
    }
    .cc-btn-primary { background: var(--brand); color: #fff; }
    .cc-btn-primary:hover { background: var(--brand-dark); color: #fff; }
    .cc-btn-quiet {
        background: #fff; color: var(--brand-dark); border-color: var(--border);
    }
    .cc-btn-quiet:hover { border-color: var(--brand); }
    .cc-btn-small { min-height: 34px; padding: 6px 12px; font-size: 13px; }
    .cc-btn-remove {
        background: #fff; color: #b3261e; border-color: #f0c9c5;
        min-height: 30px; padding: 4px 10px; font-size: 12px;
    }

    .cc-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px; }

    @media (max-width: 820px) {
        .cc-row { grid-template-columns: 1fr; }
        .cc-section { padding: 18px 16px; }
        .cc-actions { flex-direction: column-reverse; }
        .cc-actions .cc-btn { width: 100%; min-height: 44px; }
    }
</style>
{% endblock %}

{% block content %}
<div class="cc">
    <div class="cc-head">
        <h1>Create a company</h1>
        <p>A new company starts with its own books, ledgers and stock.</p>
    </div>

    <form method="POST" action="{{ url_for('company_bp.create_new_company') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

        <section class="cc-section">
            <h2>Basic information</h2>
            <div class="cc-field">
                <label for="company_name">Company name <span class="cc-required">*</span></label>
                <input type="text" id="company_name" name="company_name" required>
            </div>
        </section>

        <section class="cc-section">
            <h2>Company details</h2>
            <div class="cc-row">
                <div class="cc-field">
                    <label for="vat_registration_number">VAT registration number</label>
                    <input type="text" id="vat_registration_number" name="vat_registration_number">
                </div>
                <div class="cc-field">
                    <label for="phone">Phone</label>
                    <input type="text" id="phone" name="phone">
                </div>
            </div>
            <div class="cc-row">
                <div class="cc-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email">
                </div>
                <div class="cc-field">
                    <label for="city">City</label>
                    <input type="text" id="city" name="city">
                </div>
            </div>
            <div class="cc-field">
                <label for="address_line1">Address</label>
                <input type="text" id="address_line1" name="address_line1">
            </div>
            <div class="cc-row">
                <div class="cc-field">
                    <label for="state">State / province</label>
                    <input type="text" id="state" name="state">
                </div>
                <div class="cc-field">
                    <label for="country">Country</label>
                    <input type="text" id="country" name="country">
                </div>
            </div>
        </section>

        <section class="cc-section">
            <h2>Features</h2>
            <div class="cc-check">
                <input type="checkbox" id="inventory_applicable" name="inventory_applicable" checked>
                <label for="inventory_applicable">Inventory management</label>
            </div>
            <div class="cc-check">
                <input type="checkbox" id="vat_applicable" name="vat_applicable" checked>
                <label for="vat_applicable">VAT / tax</label>
            </div>
            <div class="cc-check">
                <input type="checkbox" id="multiple_locations_applicable" name="multiple_locations_applicable">
                <label for="multiple_locations_applicable">Multiple locations / godowns</label>
            </div>
            <div class="cc-check">
                <input type="checkbox" id="cost_center_applicable" name="cost_center_applicable">
                <label for="cost_center_applicable">Cost centres</label>
            </div>

            <div id="locationSection">
                <div id="locationsContainer"></div>
                <button type="button" class="cc-btn cc-btn-quiet cc-btn-small"
                        onclick="addLocationField()">+ Add location</button>
            </div>
        </section>

        <section class="cc-section">
            <h2>Currency</h2>
            <div class="cc-field">
                <label for="currency_code">Currency</label>
                <select id="currency_code" name="currency_code">
                    <option value="AED" selected>AED - UAE Dirham</option>
                    <option value="USD">USD - US Dollar</option>
                    <option value="EUR">EUR - Euro</option>
                    <option value="GBP">GBP - British Pound</option>
                    <option value="INR">INR - Indian Rupee</option>
                    <option value="SAR">SAR - Saudi Riyal</option>
                </select>
            </div>
        </section>

        <div class="cc-actions">
            <a href="{{ url_for('company_bp.company_gateway') }}" class="cc-btn cc-btn-quiet">Cancel</a>
            <button type="submit" class="cc-btn cc-btn-primary">Create company</button>
        </div>
    </form>
</div>

<script>
    // Ids only ever go up, so a removed location never hands its id to a new
    // one; the visible numbers are recomputed from what is on the page.
    let locationSeq = 0;

    function renumberLocations() {
        document.querySelectorAll('#locationsContainer .cc-location').forEach(
            function (entry, index) {
                const label = entry.querySelector('.cc-location-number');
                if (label) label.textContent = 'Location ' + (index + 1);
                // The first location cannot be removed while locations are on.
                const remove = entry.querySelector('.cc-btn-remove');
                if (remove) remove.hidden = index === 0;
            });
    }

    document.getElementById('multiple_locations_applicable').addEventListener('change', function () {
        const section = document.getElementById('locationSection');
        if (this.checked) {
            section.style.display = 'block';
            if (!document.querySelector('#locationsContainer .cc-location')) {
                addLocationField();
            }
        } else {
            // Hidden required fields would block the form with no visible
            // reason, so they go when the section does.
            section.style.display = 'none';
            document.getElementById('locationsContainer').innerHTML = '';
        }
    });

    function addLocationField() {
        locationSeq++;
        const entry = document.createElement('div');
        entry.className = 'cc-location';
        entry.id = 'location-' + locationSeq;
        entry.innerHTML = `
            <div class="cc-location-head">
                <span class="cc-location-number"></span>
                <button type="button" class="cc-btn cc-btn-remove"
                        onclick="removeLocation(${locationSeq})">Remove</button>
            </div>
            <div class="cc-row">
                <div class="cc-field">
                    <label>Location code <span class="cc-required">*</span></label>
                    <input type="text" name="location_code[]" required>
                </div>
                <div class="cc-field">
                    <label>Location name <span class="cc-required">*</span></label>
                    <input type="text" name="location_name[]" required>
                </div>
            </div>
            <div class="cc-field">
                <label>Address</label>
                <input type="text" name="location_address[]">
            </div>`;
        document.getElementById('locationsContainer').appendChild(entry);
        renumberLocations();
    }

    function removeLocation(id) {
        const entry = document.getElementById('location-' + id);
        if (entry) entry.remove();
        renumberLocations();
    }
</script>
{% endblock %}
